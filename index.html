<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Smart Bodo Q&A Chatbot</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, push, set, remove, update, onValue, get, child }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // YOUR FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyBnAAcyukRR7AOt8ZXdkVr9skU7L1H-S6E",
      authDomain: "db-computer-hub.firebaseapp.com",
      databaseURL: "https://db-computer-hub-default-rtdb.firebaseio.com",
      projectId: "db-computer-hub",
      storageBucket: "db-computer-hub.firebasestorage.app",
      messagingSenderId: "389257667064",
      appId: "1:389257667064:web:2574e645f1875de42d360d",
      measurementId: "G-DEQHQHVR42"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Expose to global window
    window.firebaseAuth = auth;
    window.firebaseDb = db;
    window.firebaseSignIn = signInWithEmailAndPassword;
    window.firebaseSignOut = signOut;
    window.firebaseOnAuthStateChanged = onAuthStateChanged;
    window.firebaseRef = ref;
    window.firebasePush = push;
    window.firebaseSet = set;
    window.firebaseRemove = remove;
    window.firebaseUpdate = update;
    window.firebaseOnValue = onValue;
    window.firebaseGet = get;
    window.firebaseChild = child;
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap');
    * { font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #f1f5f9; transition: background 0.2s; }
    .chat-height { height: calc(100vh - 120px); overflow-y: auto; padding-bottom: 100px; scroll-behavior: smooth; }
    .bubble-bot { border-radius: 0.2rem 1.2rem 1.2rem 1.2rem; background: white; border: 1px solid #e2e8f0; }
    .bubble-user { border-radius: 1.2rem 1.2rem 0.2rem 1.2rem; background: #2563eb; color: white; }
    .typing-dot { width: 6px; height: 6px; background: #3b82f6; border-radius: 50%; animation: wave 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes wave { 0%, 60%, 100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
    .secret-pulse { animation: glowPulse 1.8s infinite; }
    @keyframes glowPulse { 0% { box-shadow: 0 0 0 0 rgba(59,130,246,0.5); } 70% { box-shadow: 0 0 0 12px rgba(59,130,246,0); } 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); } }
    .hidden-view { display: none !important; }
    .admin-scroll { max-height: 70vh; overflow-y: auto; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
    /* smooth fade */
    .fade-enter { animation: fadeIn 0.2s ease-in; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body class="p-2 sm:p-4">

  <!-- ========== MAIN CHAT VIEW ========== -->
  <div id="viewChat" class="max-w-3xl mx-auto flex flex-col">
    <!-- header with secret logo -->
    <div class="flex justify-between items-center mb-2 bg-white rounded-2xl shadow-sm p-3 border border-gray-200">
      <div id="secretLogo" class="flex items-center gap-2 cursor-pointer select-none group">
        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-md group-active:scale-95 transition">
          <i class="fas fa-robot text-white text-lg"></i>
        </div>
        <span class="font-bold text-xl tracking-tight text-gray-800">Bodo Q&A Smart Chatbot<span class="text-blue-600">Bot</span></span>
      </div>
      <div class="text-xs bg-gray-100 px-3 py-1.5 rounded-full text-gray-600 font-medium">Dibakar Basumatary</div>
    </div>

    <!-- chat messages -->
    <div id="chatWindow" class="chat-height flex flex-col gap-3 px-1">
      <div class="flex justify-start">
        <div class="bubble-bot p-4 max-w-[90%] shadow-sm text-sm">
          <span class="font-semibold text-blue-600">Bodo Smart Q&A Chatbot</span><br>
          खुलुमबाय! आं बर' स्मार्ट चैटबट। आं नोंथांनो नोंथांनि सोंलुफोरनि गेबें फिन्नाय होनो हाजासे नाजागोन।
        </div>
      </div>
    </div>

    <!-- input bar -->
    <div class="fixed bottom-0 left-0 right-0 p-3 bg-gradient-to-t from-gray-100 via-gray-100 to-transparent">
      <div class="max-w-3xl mx-auto flex gap-2 bg-white p-2 rounded-2xl shadow-lg border border-gray-200">
        <input id="userInput" type="text" placeholder="Type your question..." 
               class="flex-1 p-3 bg-transparent outline-none text-base rounded-xl">
        <button id="sendBtn" class="bg-blue-600 hover:bg-blue-700 text-white w-12 h-12 rounded-xl flex items-center justify-center shadow-md transition">
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- ========== ADMIN LOGIN (hidden by default) ========== -->
  <div id="viewLogin" class="hidden-view max-w-md mx-auto mt-12">
    <div class="bg-white p-6 rounded-3xl shadow-xl border border-gray-200">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold text-gray-800">Admin Login</h2>
        <button id="closeLoginBtn" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
      </div>
      <div class="space-y-3">
        <input id="adminEmail" type="email" placeholder="Email" class="w-full p-3.5 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
        <input id="adminPassword" type="password" placeholder="Password" class="w-full p-3.5 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
        <button id="loginBtn" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow-md hover:bg-blue-700 transition">Login</button>
        <p id="loginError" class="text-red-500 text-sm text-center hidden"></p>
      </div>
    </div>
  </div>

  <!-- ========== ADMIN CMS (hidden by default) ========== -->
  <div id="viewAdmin" class="hidden-view max-w-3xl mx-auto">
    <div class="flex justify-between items-center my-4">
      <h2 class="text-xl font-bold text-gray-800"><i class="fas fa-cog mr-2 text-blue-600"></i>Manage Q&A</h2>
      <div class="flex gap-2">
        <span id="statsCount" class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-xs font-bold">0 entries</span>
        <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold shadow">Logout</button>
      </div>
    </div>

    <!-- form -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 mb-5">
      <h3 class="font-semibold text-gray-700 mb-3" id="formTitle">Add New Q&A</h3>
      <div class="space-y-3">
        <input id="newQuestion" type="text" placeholder="Question" class="w-full p-3 border rounded-xl outline-none focus:ring-1 focus:ring-blue-500">
        <textarea id="newAnswer" rows="2" placeholder="Answer" class="w-full p-3 border rounded-xl outline-none focus:ring-1 focus:ring-blue-500"></textarea>
        <div class="flex gap-2">
          <button id="saveQnaBtn" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl transition">Save</button>
          <button id="cancelEditBtn" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 rounded-xl transition hidden">Cancel</button>
        </div>
      </div>
    </div>

    <!-- list -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="admin-scroll p-3">
        <div id="qnaList" class="space-y-2">
          <p class="text-gray-400 text-center py-6">Loading...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== SCRIPT ========== -->
  <script>
    (function waitForFirebase() {
      if (window.firebaseAuth && window.firebaseDb && window.firebaseOnAuthStateChanged) {
        // ---------- DOM refs ----------
        const viewChat = document.getElementById('viewChat');
        const viewLogin = document.getElementById('viewLogin');
        const viewAdmin = document.getElementById('viewAdmin');
        const chatWindow = document.getElementById('chatWindow');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const secretLogo = document.getElementById('secretLogo');

        const adminEmail = document.getElementById('adminEmail');
        const adminPassword = document.getElementById('adminPassword');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const closeLoginBtn = document.getElementById('closeLoginBtn');

        const newQuestion = document.getElementById('newQuestion');
        const newAnswer = document.getElementById('newAnswer');
        const saveQnaBtn = document.getElementById('saveQnaBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const formTitle = document.getElementById('formTitle');
        const qnaList = document.getElementById('qnaList');
        const statsCount = document.getElementById('statsCount');
        const logoutBtn = document.getElementById('logoutBtn');

        // ---------- State ----------
        let currentUser = null;
        let editingKey = null;
        let qnaCache = [];
        const qnaRef = window.firebaseRef(window.firebaseDb, 'qna');

        // ---------- View switching ----------
        function showView(view) {
          viewChat.classList.add('hidden-view');
          viewLogin.classList.add('hidden-view');
          viewAdmin.classList.add('hidden-view');
          if (view === 'chat') viewChat.classList.remove('hidden-view');
          if (view === 'login') viewLogin.classList.remove('hidden-view');
          if (view === 'admin') viewAdmin.classList.remove('hidden-view');
        }

        // ---------- Secret hold (6 seconds) ----------
        let holdTimer = null;
        let isHolding = false;

        function startHold(e) {
          if (e.type === 'mousedown' && e.button !== 0) return;
          if (isHolding) return;
          isHolding = true;
          secretLogo.classList.add('secret-pulse');
          holdTimer = setTimeout(() => {
            if (isHolding) {
              showView('login');
              secretLogo.classList.remove('secret-pulse');
              isHolding = false;
            }
          }, 6000);
        }

        function endHold() {
          if (!isHolding) return;
          isHolding = false;
          secretLogo.classList.remove('secret-pulse');
          if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
        }

        secretLogo.addEventListener('mousedown', startHold);
        secretLogo.addEventListener('mouseup', endHold);
        secretLogo.addEventListener('mouseleave', endHold);
        secretLogo.addEventListener('touchstart', startHold, { passive: true });
        secretLogo.addEventListener('touchend', endHold);
        secretLogo.addEventListener('touchcancel', endHold);
        secretLogo.addEventListener('contextmenu', (e) => e.preventDefault());

        closeLoginBtn.addEventListener('click', () => showView('chat'));

        // ---------- Auth ----------
        window.firebaseOnAuthStateChanged(window.firebaseAuth, (user) => {
          if (user) {
            currentUser = user;
            showView('admin');
            loadQnaList();
          } else {
            currentUser = null;
            showView('chat');
            qnaList.innerHTML = '<p class="text-gray-400 text-center py-6">Login as admin to manage Q&A</p>';
            resetForm();
          }
        });

        loginBtn.addEventListener('click', async () => {
          const email = adminEmail.value.trim();
          const pass = adminPassword.value;
          if (!email || !pass) {
            loginError.textContent = 'Please enter email and password.';
            loginError.classList.remove('hidden');
            return;
          }
          loginError.classList.add('hidden');
          loginBtn.disabled = true;
          loginBtn.textContent = 'Logging in...';
          try {
            await window.firebaseSignIn(window.firebaseAuth, email, pass);
          } catch (error) {
            loginError.textContent = error.message || 'Login failed.';
            loginError.classList.remove('hidden');
          } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = 'Login';
          }
        });

        logoutBtn.addEventListener('click', async () => {
          try {
            await window.firebaseSignOut(window.firebaseAuth);
            showView('chat');
          } catch (error) { console.error(error); }
        });

        // ---------- Q&A CRUD ----------
        function resetForm() {
          editingKey = null;
          newQuestion.value = '';
          newAnswer.value = '';
          formTitle.textContent = 'Add New Q&A';
          saveQnaBtn.textContent = 'Save';
          cancelEditBtn.classList.add('hidden');
        }

        function loadQnaList() {
          if (!currentUser) return;
          window.firebaseOnValue(qnaRef, (snapshot) => {
            const data = snapshot.val();
            qnaCache = data ? Object.entries(data).map(([key, val]) => ({ key, ...val })) : [];
            statsCount.textContent = `${qnaCache.length} entries`;
            if (!viewAdmin.classList.contains('hidden-view')) renderQnaList();
          });
        }

        function renderQnaList() {
          if (!qnaCache.length) {
            qnaList.innerHTML = '<p class="text-gray-400 text-center py-6">No questions yet. Add your first Q&A!</p>';
            return;
          }
          qnaCache.sort((a, b) => (a.question || '').localeCompare(b.question || ''));
          qnaList.innerHTML = qnaCache.map(item => `
            <div class="bg-gray-50 border border-gray-200 rounded-xl p-3 flex flex-col gap-1">
              <div class="flex justify-between items-start gap-2">
                <span class="font-medium text-gray-800 text-sm flex-1 break-words">❓ ${escapeHtml(item.question) || '(no question)'}</span>
                <div class="flex gap-1 shrink-0">
                  <button class="edit-btn text-xs bg-blue-100 hover:bg-blue-200 text-blue-700 px-2.5 py-1 rounded-lg" data-key="${item.key}" data-q="${escapeHtml(item.question)}" data-a="${escapeHtml(item.answer)}">Edit</button>
                  <button class="delete-btn text-xs bg-red-100 hover:bg-red-200 text-red-700 px-2.5 py-1 rounded-lg" data-key="${item.key}">Del</button>
                </div>
              </div>
              <div class="text-xs text-gray-600 break-words">💡 ${escapeHtml(item.answer) || '(no answer)'}</div>
            </div>
          `).join('');

          document.querySelectorAll('.edit-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
              const key = e.target.dataset.key;
              const q = e.target.dataset.q;
              const a = e.target.dataset.a;
              editingKey = key;
              newQuestion.value = q;
              newAnswer.value = a;
              formTitle.textContent = 'Edit Q&A';
              saveQnaBtn.textContent = 'Update';
              cancelEditBtn.classList.remove('hidden');
              newQuestion.scrollIntoView({ behavior: 'smooth', block: 'center' });
            });
          });

          document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
              const key = e.target.dataset.key;
              if (!confirm('Delete this Q&A?')) return;
              try {
                await window.firebaseRemove(window.firebaseRef(window.firebaseDb, `qna/${key}`));
              } catch (error) { alert('Delete failed: ' + error.message); }
            });
          });
        }

        saveQnaBtn.addEventListener('click', async () => {
          const question = newQuestion.value.trim();
          const answer = newAnswer.value.trim();
          if (!question || !answer) {
            alert('Please enter both question and answer.');
            return;
          }
          if (!currentUser) { alert('You must be logged in.'); return; }
          saveQnaBtn.disabled = true;
          saveQnaBtn.textContent = 'Saving...';
          try {
            if (editingKey) {
              await window.firebaseUpdate(window.firebaseRef(window.firebaseDb, `qna/${editingKey}`), { question, answer });
            } else {
              const newRef = window.firebasePush(qnaRef);
              await window.firebaseSet(newRef, { question, answer });
            }
            resetForm();
          } catch (error) {
            alert('Save failed: ' + error.message);
          } finally {
            saveQnaBtn.disabled = false;
            saveQnaBtn.textContent = editingKey ? 'Update' : 'Save';
          }
        });

        cancelEditBtn.addEventListener('click', resetForm);

        // ---------- Chat logic ----------
        let chatInitialized = false;

        function addMessage(text, isUser = false, isBot = false) {
          const div = document.createElement('div');
          div.className = `flex ${isUser ? 'justify-end' : 'justify-start'} fade-enter`;
          const bubble = document.createElement('div');
          bubble.className = `p-4 max-w-[90%] shadow-sm text-sm ${isUser ? 'bubble-user' : 'bubble-bot'}`;
          bubble.textContent = text;
          div.appendChild(bubble);
          chatWindow.appendChild(div);
          chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function handleAsk() {
          const question = userInput.value.trim();
          if (!question) return;
          if (!chatInitialized) {
            chatWindow.innerHTML = '';
            chatInitialized = true;
          }
          addMessage(question, true, false);
          userInput.value = '';

          // typing indicator
          const typingDiv = document.createElement('div');
          typingDiv.className = 'flex justify-start';
          typingDiv.innerHTML = `<div class="bubble-bot p-4 shadow-sm flex gap-1"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
          chatWindow.appendChild(typingDiv);
          chatWindow.scrollTop = chatWindow.scrollHeight;

          try {
            const snapshot = await window.firebaseGet(qnaRef);
            const data = snapshot.val();
            let bestMatch = null;

            if (data) {
              const questionLower = question.toLowerCase();
              const items = Object.entries(data).map(([key, val]) => ({ key, ...val }));

              // exact match
              for (let item of items) {
                if (item.question && item.question.toLowerCase() === questionLower) {
                  bestMatch = item; break;
                }
              }
              // substring match
              if (!bestMatch) {
                for (let item of items) {
                  if (item.question && item.question.toLowerCase().includes(questionLower)) {
                    bestMatch = item; break;
                  }
                }
              }
              // reverse substring
              if (!bestMatch) {
                for (let item of items) {
                  if (item.question && questionLower.includes(item.question.toLowerCase())) {
                    bestMatch = item; break;
                  }
                }
              }
              // word scoring
              if (!bestMatch) {
                const words = questionLower.split(/\s+/).filter(w => w.length > 2);
                if (words.length > 0) {
                  let bestScore = 0;
                  for (let item of items) {
                    if (!item.question) continue;
                    const qLower = item.question.toLowerCase();
                    let score = 0;
                    words.forEach(word => { if (qLower.includes(word)) score++; });
                    if (score > bestScore) { bestScore = score; bestMatch = item; }
                  }
                  if (bestScore === 0) bestMatch = null;
                }
              }
            }

            typingDiv.remove();
            if (bestMatch) {
              addMessage(bestMatch.answer, false, true);
            } else {
              addMessage("Sorry, I don't have an answer for that. Please ask another question.", false, true);
            }
          } catch (error) {
            typingDiv.remove();
            addMessage("Something went wrong. Please try again.", false, true);
            console.error(error);
          }
        }

        sendBtn.addEventListener('click', handleAsk);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleAsk(); });

        // helper
        function escapeHtml(unsafe) {
          if (!unsafe) return '';
          return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // initial
        if (!currentUser) qnaList.innerHTML = '<p class="text-gray-400 text-center py-6">Login as admin to manage Q&A</p>';
      } else {
        setTimeout(waitForFirebase, 50);
      }
    })();
  </script>
</body>
</html>
